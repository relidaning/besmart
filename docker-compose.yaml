services:
  besmart-https:
    image: nginx:alpine
    ports:
      - '5443:443'
    volumes:
      - ./config/nginx/besmart.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/mkcert/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./config/mkcert/key.pem:/etc/nginx/certs/key.pem:ro
      - ./config/mkcert/rootCA.pem:/etc/nginx/certs/rootCA.pem:ro
    depends_on:
      - besmart
    restart: unless-stopped

  besmart:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5090:3001'
    environment:
      - 'TZ=Asia/Shanghai'
      - 'NODE_ENV=production'
      - 'APP_URL=https://192.168.255.6:5443'
      - 'JWT_SECRET=${JWT_SECRET:?set it in .env (see .env.example)}'
      - 'VAULT_PATH=/vault'
      - 'VAULT_NAME=lidaning'
      - 'VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:?set it in .env (see .env.example)}'
      - 'VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:?set it in .env (see .env.example)}'
      - 'VAPID_EMAIL=re453882101@gmail.com'
      - 'CA_CERT_PATH=/certs/rootCA.pem'
      - 'DB_PATH=/app/database/${BESMART_DB_FILENAME:-besmart.db}'
      - 'MUSIC_VIDEOS_DIR=/media/videos'
      - 'MUSIC_DIR=/media/music'
      # Hours before this are treated as the previous day (default: 6)
      # - 'DAY_START_HOUR=6'
      # Email verification (optional — omit to skip email verification)
      # - 'SMTP_HOST=smtp.example.com'
      # - 'SMTP_PORT=587'
      # - 'SMTP_USER=user@example.com'
      # - 'SMTP_PASS=yourpassword'
      # - 'SMTP_FROM=noreply@besmart.app'
      # Google OAuth (optional)
      # - 'GOOGLE_CLIENT_ID=your-google-client-id'
      # - 'GOOGLE_CLIENT_SECRET=your-google-client-secret'
      # GitHub OAuth (optional)
      # - 'GITHUB_CLIENT_ID=your-github-client-id'
      # - 'GITHUB_CLIENT_SECRET=your-github-client-secret'
      # WeChat OAuth (optional — requires WeChat Open Platform app)
      # - 'WECHAT_APP_ID=your-wechat-app-id'
      # - 'WECHAT_APP_SECRET=your-wechat-app-secret'
    volumes:
      - type: bind
        source: ${BESMART_DB_DIR:?set it in .env (see .env.example)}
        target: /app/database
        bind:
          create_host_path: false
      - /data/nextcloud/obsidian/lidaning:/vault
      - ./config/mkcert:/certs:ro
      # Focus music plays ~/Videos (audio only); Sleep plays ~/Music/Rain
      - /home/shake/Videos:/media/videos:ro
      - /home/shake/Music:/media/music:ro
    restart: unless-stopped

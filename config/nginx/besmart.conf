server {
    listen 443 ssl;
    http2 on;
    server_name 192.168.255.6 192.168.1.8 localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Serve the root CA cert so the phone can download and install it
    location = /rootCA.pem {
        alias /etc/nginx/certs/rootCA.pem;
        default_type application/x-pem-file;
    }

    location / {
        proxy_pass http://besmart:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
